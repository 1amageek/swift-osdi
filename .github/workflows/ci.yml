name: Standalone native verification

on:
  push:
    branches: [main]
    paths-ignore: [PROGRESS.md]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ordinary-debug
            configuration: debug
            precision: false
            sanitizer: ''
          - lane: precision-release
            configuration: release
            precision: true
            sanitizer: ''
          - lane: precision-address
            configuration: debug
            precision: true
            sanitizer: address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify default Swift 6.4.0 release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          import platform
          import re
          import subprocess
          assert platform.machine() == 'arm64', 'macos-26 must provide arm64'
          assert int(platform.mac_ver()[0].split('.')[0]) >= 26
          version = subprocess.check_output(['swift', '--version'], text=True, timeout=30)
          assert re.search(r'\bSwift version 6\.4(?:\.0)?(?:\s|\()', version) and 'DEVELOPMENT' not in version and '-dev' not in version, version
          print(version)
          PYVERSION
      - name: Install numeric build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          subprocess.run(['brew', 'install', 'gmp', 'mpfr', 'pkgconf'], check=True, timeout=600)
          subprocess.run(['pkg-config', '--modversion', 'gmp', 'mpfr'], check=True, timeout=30)
          PY
      - name: Run bounded standalone verification
        env:
          OSDI_CI_LANE: ${{ matrix.lane }}
          OSDI_CI_CONFIGURATION: ${{ matrix.configuration }}
          OSDI_CI_PRECISION: ${{ matrix.precision }}
          OSDI_CI_SANITIZER: ${{ matrix.sanitizer }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--clang /usr/bin/clang
                --output "$GITHUB_WORKSPACE/.verification/ci-$OSDI_CI_LANE"
                --configuration "$OSDI_CI_CONFIGURATION" --jobs 2 --timeout-seconds 1200)
          if [[ "$OSDI_CI_PRECISION" == true ]]; then args+=(--precision); fi
          if [[ -n "$OSDI_CI_SANITIZER" ]]; then args+=(--sanitize "$OSDI_CI_SANITIZER"); fi
          python3 Tools/OSDIStandaloneVerification/run.py "${args[@]}"
      - name: Verify ordinary Swift tests reuse fixtures without Python
        if: matrix.lane == 'ordinary-debug'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCACHE'
          from pathlib import Path
          import json
          import os
          import shlex
          import subprocess
          import time
          root = Path(os.environ['GITHUB_WORKSPACE'])
          output = root / '.verification/ci-swift-cache'
          output.mkdir(parents=True, exist_ok=False)
          guard = output / 'guard'
          guard.mkdir()
          (guard/'python3').write_text('#!/bin/sh\necho "Unexpected Python invocation" >&2\nexit 97\n')
          (guard/'python3').chmod(0o755)
          compiler = subprocess.check_output(['xcrun', '--find', 'clang'], text=True, timeout=10).strip()
          counter = output/'compiler-invocations.log'
          wrapper = output/'clang-observer'
          wrapper.write_text("#!/bin/sh\nprintf 'compile\\n' >> " + shlex.quote(str(counter))
                             + "\nexec " + shlex.quote(compiler) + ' "$@"\n')
          wrapper.chmod(0o755)
          environment = dict(os.environ)
          environment.update(PATH=str(guard)+':'+environment['PATH'], OSDI_TEST_CLANG=str(wrapper),
                             OSDI_TEST_CACHE_DIRECTORY=str(output/'cache'))
          for key in list(environment):
              if key.startswith('OSDI_') and key not in ('OSDI_TEST_CLANG', 'OSDI_TEST_CACHE_DIRECTORY'):
                  del environment[key]
          reports = []
          for name in ('cold', 'warm'):
              before = counter.read_text().count('compile\n') if counter.exists() else 0
              started = time.monotonic()
              with (output/(name+'.log')).open('w') as log:
                  subprocess.run(['swift', 'test', '--jobs', '2'], cwd=root, env=environment,
                                 stdout=log, stderr=subprocess.STDOUT, timeout=120, check=True)
              builds = counter.read_text().count('compile\n')-before
              assert (builds > 0 if name == 'cold' else builds == 0), (name, builds)
              reports.append({'run':name, 'fixtureCompilerInvocations':builds,
                              'elapsedSeconds':time.monotonic()-started})
          (output/'receipt.json').write_text(json.dumps(reports, indent=2)+'\n')
          print(json.dumps(reports))
          PYCACHE
      - name: Run separate public-product consumer
        if: matrix.lane == 'ordinary-debug'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys
          root = Path(os.environ['GITHUB_WORKSPACE'])
          manifest = (root / 'Package.swift').read_text()
          bindings = re.findall(r'\.package\s*\(\s*url:\s*"([^"]*CircuiteFoundation(?:\.git)?)"', manifest)
          assert len(bindings) == 1, 'Expected one CircuiteFoundation URL'
          url = bindings[0]
          resolved = json.loads((root / 'Package.resolved').read_bytes())
          pins = [pin for pin in resolved['pins'] if pin['identity'] == 'circuitefoundation' and pin['location'] == url]
          assert len(pins) == 1 and pins[0]['state'].get('version'), 'Expected a stable Foundation resolution'
          revision = pins[0]['state']['revision']
          source_revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=30).strip()
          # The local-only tag exercises SwiftPM's stable-version dependency rules without publication.
          subprocess.run(['git', 'tag', '0.0.0', source_revision], check=True, timeout=30)
          subprocess.run([sys.executable, 'Tools/OSDIConsumerVerification/verify_consumer.py',
                          '--source-url', root.as_uri(), '--source-revision', source_revision,
                          '--source-version', '0.0.0',
                          '--foundation-url', url, '--foundation-revision', revision,
                          '--scratch', str(Path(os.environ['RUNNER_TEMP']) / 'osdi-consumer'),
                          '--clang', '/usr/bin/clang',
                          '--precision', '--timeout-seconds', '1200'], check=True, timeout=2400)
          PY
      - name: Retain receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.lane }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .verification/ci-swift-cache/receipt.json
            .verification/ci-swift-cache/*.log
            .verification/ci-${{ matrix.lane }}/receipt.json
            .verification/ci-${{ matrix.lane }}/*.stdout
            .verification/ci-${{ matrix.lane }}/*.stderr
            .verification/ci-${{ matrix.lane }}/fixtures/manifest.json
            .verification/ci-${{ matrix.lane }}/numeric/receipt.json
            .verification/ci-${{ matrix.lane }}/numeric/numeric-profile.json
            .verification/ci-${{ matrix.lane }}/ranges/manifest.json
            .verification/ci-${{ matrix.lane }}/charts/manifest.json
            .verification/ci-${{ matrix.lane }}/covers/manifest.json
            .verification/ci-${{ matrix.lane }}/identities/manifest.json
            .verification/ci-${{ matrix.lane }}/identity-proof/receipt.json
            .verification/ci-${{ matrix.lane }}/identity-proof/*.json
            ${{ runner.temp }}/osdi-consumer/receipt.json
            ${{ runner.temp }}/osdi-consumer/failure.json
